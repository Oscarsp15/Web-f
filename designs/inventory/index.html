<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Inventory Dashboard</title>
    <meta
      name="description"
      content="An inventory management dashboard: searchable stock table with expandable item detail, monthly figures and sales trend."
    />
    <meta name="theme-color" content="#efecff" />
    <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />

    <!-- Poppins won the per-glyph ranking against the reference: .826 mean IoU
         over a e o y D b, first on four of six, ahead of Outfit at .801. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    />

    <link rel="stylesheet" href="./assets/css/tokens.css" />
    <link rel="stylesheet" href="./assets/css/layout.css" />
    <link rel="stylesheet" href="./assets/css/components.css" />
  </head>

  <body>
    <div class="stage">
      <header class="stage__head">
        <h1>Inventory Dashboard</h1>
        <div class="stage__tools">
          <button type="button" class="select" id="side-toggle">
            <span data-icon="menu" data-icon-size="16"></span> Panel
          </button>
          <a class="select" href="../../">← Gallery</a>
        </div>
      </header>

      <div class="app">
        <aside class="rail" aria-label="Sections">
          <span class="rail__logo" data-icon="logo" data-icon-size="26"></span>
          <nav id="rail-nav" aria-label="Main"
               style="display:flex;flex-direction:column;gap:6px"></nav>
          <div class="rail__foot" id="rail-team"></div>
        </aside>

        <section class="side" id="side" aria-label="Search and figures"></section>

        <section class="main" aria-label="Items">
          <div class="main__toolbar toolbar-strip" id="toolbar"></div>
          <div class="main__scroll" id="table-host"></div>
        </section>
      </div>
    </div>

    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>
