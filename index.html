<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Design Rebuilds</title>
    <meta
      name="description"
      content="Product designs rebuilt in plain HTML, CSS and JavaScript — each one with the skill that documents how it was made."
    />
    <meta name="theme-color" content="#eceef2" />
    <link rel="icon" href="./assets/previews/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/gallery/gallery.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="wrap topbar__inner">
        <a class="wordmark" href="#top">
          <span class="wordmark__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <rect x="2" y="4" width="20" height="7" rx="2.4" />
              <rect x="2" y="13" width="12" height="7" rx="2.4" opacity=".45" />
            </svg>
          </span>
          Design Rebuilds
        </a>
        <nav class="topbar__nav" aria-label="Designs">
          <a href="#stakent">Stakent</a>
          <a href="#sequence">Sequence</a>
        </nav>
        <button type="button" class="lang" id="lang">Español</button>
      </div>
    </header>

    <main id="top">
      <section class="masthead">
        <div class="wrap">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title"></h1>
          <p class="intro" id="intro"></p>
          <div class="stats" id="stats"></div>
        </div>
      </section>

      <div class="wrap">
        <div class="entries" id="entries"></div>
      </div>
    </main>

    <footer class="foot">
      <div class="wrap foot__inner">
        <span id="footer-note"></span>
        <a href="https://github.com/Oscarsp15/Web-f" rel="noreferrer" id="source"></a>
      </div>
    </footer>

    <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
      <div class="viewer__head">
        <div class="viewer__id">
          <h2 id="viewer-title">Skill</h2>
          <code id="viewer-path"></code>
        </div>
        <button type="button" class="viewer__close" id="viewer-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="m6.5 6.5 11 11m0-11-11 11" />
          </svg>
        </button>
      </div>
      <div class="viewer__tabs" id="viewer-tabs" role="tablist" aria-label="Skill documents"></div>
      <div class="viewer__body" id="viewer-body"></div>
      <p class="viewer__note" id="viewer-note"></p>
    </dialog>

    <script type="module" src="./assets/gallery/gallery.js"></script>
  </body>
</html>
